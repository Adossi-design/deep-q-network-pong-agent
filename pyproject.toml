[project]
name = "deep-q-network-pong-agent"
version = "0.1.0"
description = "Group 10: Deep Q-Network agent that learns to play Atari Pong, built with PyTorch and Gymnasium"
readme = "README.md"
authors = [
    { name = "Larissa Iriza", email = "l.iriza@alustudent.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ale-py>=0.12.1",
    "gymnasium>=1.4.0",
    "imageio>=2.38.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "torch>=2.15.0",
]

[tool.uv]
package = false
